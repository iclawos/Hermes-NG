[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zilli"
version = "1.1.0"
description = "Zilli: self-evolving AI agent framework for autonomous tool development"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zilli Contributors"},
]
keywords = ["ai", "agent", "reinforcement-learning", "distillation", "autonomous"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "httpx>=0.27",
    "dspy-ai>=2.5",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "transformers>=4.36",
]
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
workflow = [
    "celery[redis]>=5.4",
]
vector = [
    "chromadb>=0.6",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "httpx>=0.27",
]
ppm = [
    "scikit-learn>=1.5",
    "onnxruntime>=1.20",
    "skl2onnx>=1.17",
]
ci = [
    "zilli[server,workflow,vector,dev,ppm]",
    "streamlit>=1.40",
    "pyright>=1.1.400",
]
all = [
    "zilli[train,server,workflow,vector,dev,ppm]",
]

[project.urls]
homepage = "https://github.com/ethercoinai/Zilli"
repository = "https://github.com/ethercoinai/Zilli.git"

[project.scripts]
zilli = "zilli.cli:main"
zilli-evolve = "zilli.evolution.cli:main"

[tool.setuptools.packages.find]
include = ["zilli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
typeCheckingMode = "standard"
include = ["zilli"]
exclude = ["tests", "**/__pycache__"]
reportMissingTypeStubs = false
reportMissingModuleSource = true
reportPossiblyUnboundVariable = false

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
